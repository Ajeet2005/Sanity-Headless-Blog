<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anubhav" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Portal Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
      }
      .card {
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        width: min(90vw, 360px);
      }
      input {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 10px 12px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        margin-top: 8px;
      }
      #status {
        margin-top: 10px;
        color: #475569;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Portal Login</h2>
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="login-btn">Login</button>
      <p id="status">Sign in with your Firebase account.</p>
    </div>

    <script type="module">
      // Self-hosted Firebase SDK (vendor/) — the gstatic CDN is blocked by
      // browser tracking prevention (Edge/Brave), breaking login too.
      import { initializeApp } from "./vendor/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
      } from "./vendor/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDNdgYedYk2yI3VsH58Ao3HF1A1UWMamD0",
        authDomain:
          window.location.hostname === "127.0.0.1" ||
          window.location.hostname === "localhost"
            ? window.location.hostname
            : "sanity-blog-auth.firebaseapp.com",
        projectId: "sanity-blog-auth",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect") || "index.html";
      const status = document.getElementById("status");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("login-btn");

      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.replace(redirect);
        }
      });

      loginBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          status.textContent = "Please enter both email and password.";
          return;
        }

        status.textContent = "Signing in...";
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        try {
          await signInWithEmailAndPassword(auth, email, password);
          window.location.replace(redirect);
        } catch (error) {
          status.textContent = error.message || "Sign-in failed.";
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        }
      });
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { updateViaCache: 'none' })
          .then(function () { console.log('SW registered'); })
          .catch(function () { console.log('SW registration failed'); });
      }
    </script>
  </body>
</html>
